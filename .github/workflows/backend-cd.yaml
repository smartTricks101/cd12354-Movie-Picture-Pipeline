```yaml
name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install pipenv

      - run: pipenv install --dev --skip-lock
        working-directory: starter/backend

      - run: pipenv run flake8
        working-directory: starter/backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install pipenv

      - run: pipenv install --dev --skip-lock
        working-directory: starter/backend

      - run: pipenv run pytest -v
        working-directory: starter/backend

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS account ID
        run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - run: |
          docker build \
            --tag $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }} \
            starter/backend

      - run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - run: aws eks update-kubeconfig --region us-east-1 --name cluster

      - name: Get AWS account ID
        run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - run: |
          cd starter/backend/k8s
          kustomize edit set image backend=$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}
          kustomize build | kubectl apply -f -

      - name: Verify ECR image
        run: |
          aws ecr describe-images \
            --repository-name backend \
            --image-ids imageTag=${{ github.sha }}

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/backend --timeout=120s
          kubectl get all
          kubectl describe deployment backend
```
